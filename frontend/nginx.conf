server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the backend container on the Compose network.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Single-page app: unknown paths fall back to index.html so React Router can handle them.
  location / {
    try_files $uri /index.html;
  }
}
